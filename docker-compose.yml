services:

  db:
    image: mysql:8.0
    container_name: tienda_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - tienda_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: tienda_backend  
    restart: unless-stopped
    ports:
      - "8099:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tienda_network

  frontend:
    build: ./frontend
    container_name: tienda_frontend
    restart: unless-stopped
    ports:
      - "8005:80"
    depends_on:
      - backend
    networks:
      - tienda_network

networks:
  tienda_network:
    driver: bridge

volumes:
  db_data:
